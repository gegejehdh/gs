*{box-sizing:border-box;margin:0}
body{font:17px/1.65 Rajdhani,system-ui,sans-serif;color:var(--t);background:var(--bg);overflow-x:hidden}
img{max-width:100%;display:block}::selection{background:var(--r);color:#fff}
h1,h2,h3{font-family:Orbitron,system-ui,sans-serif;color:#fff;line-height:1.25;letter-spacing:.5px}
h2{font-size:1.45rem;margin:0 0 1.2rem;display:flex;align-items:center;gap:.7rem}
h2::before{content:"";width:6px;height:1.3em;background:linear-gradient(var(--y),var(--r));border-radius:3px;box-shadow:0 0 12px var(--r)}
h3{font-size:1rem}.pad h3{color:var(--y);margin-bottom:.5rem}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s,transform .7s cubic-bezier(.2,.7,.2,1)}.rv.in{opacity:1;transform:none}
.fx{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.fx::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(47,107,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(47,107,255,.09) 1px,transparent 1px);background-size:48px 48px;-webkit-mask:radial-gradient(ellipse at 50% 0,#000 15%,transparent 75%);mask:radial-gradient(ellipse at 50% 0,#000 15%,transparent 75%)}
.fx i{position:absolute;width:40vmax;height:40vmax;border-radius:50%;filter:blur(90px);opacity:.25;animation:dr 18s ease-in-out infinite alternate}
.fx i:nth-child(1){background:var(--r);top:-15vmax;left:-10vmax}.fx i:nth-child(2){background:var(--b);right:-12vmax;top:20vh}.fx i:nth-child(3){background:var(--y);opacity:.1;bottom:-20vmax;left:30vw}
@keyframes dr{to{transform:translate(6vmax,5vmax) scale(1.15)}}
.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:.6rem 5%;background:rgba(7,11,26,.72);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.1);box-shadow:0 1px 0 rgba(255,45,61,.5),0 4px 24px rgba(47,107,255,.15)}
.brand{display:flex;gap:.6rem;align-items:center;text-decoration:none;color:#fff;font-family:Orbitron,sans-serif;letter-spacing:2px}.brand img{height:40px;filter:drop-shadow(0 0 8px rgba(255,45,61,.6))}
#mn{display:flex;gap:1.3rem}#mn a{text-decoration:none;color:#cfd6ff;font-weight:600;text-transform:uppercase;font-size:.85rem;letter-spacing:1.5px;padding:.2rem 0;border-bottom:2px solid transparent;transition:.25s}#mn a:hover,#mn a.on{color:#fff;border-color:var(--y);text-shadow:0 0 10px var(--y)}
#bg{display:none;font-size:1.7rem;background:none;border:0;color:#fff;cursor:pointer}
@media(max-width:820px){#bg{display:block}#mn{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:#0b1128;padding:1rem 5%;gap:.9rem;border-bottom:1px solid rgba(255,255,255,.1)}#mn.open{display:flex}}
.sec{max-width:1100px;margin:auto;padding:3rem 5%}.narrow{max-width:700px}.mut,small{color:var(--m)}
.hero{position:relative;overflow:hidden;border-bottom:1px solid rgba(47,107,255,.5);box-shadow:0 10px 50px rgba(47,107,255,.2);background:linear-gradient(180deg,rgba(7,11,26,.45),var(--bg)),linear-gradient(120deg,rgba(47,107,255,.4),rgba(255,45,61,.3)),var(--hi) center/cover}
.hero .sec{position:relative;padding:6rem 5% 5rem}
.hero h1{font-size:clamp(1.8rem,5.5vw,3.2rem);margin:1.2rem 0;max-width:680px;background:linear-gradient(90deg,#fff,#9db8ff,var(--y));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:580px;font-size:1.15rem;color:#d6dcff}
.orb{position:absolute;right:5%;top:50%;width:min(300px,36vw);transform:translateY(-50%);filter:drop-shadow(0 0 30px rgba(255,45,61,.75));animation:fl 6s ease-in-out infinite alternate}
@keyframes fl{to{transform:translateY(-58%) rotate(4deg)}}@media(max-width:700px){.orb{opacity:.18;width:62vw;right:-10%}}
.chip{display:inline-block;border:1px solid var(--y);background:rgba(255,210,63,.1);color:var(--y);font:700 .7rem Orbitron,sans-serif;letter-spacing:2px;text-transform:uppercase;padding:.35rem .9rem;border-radius:99px;box-shadow:0 0 14px rgba(255,210,63,.25)}
.cta{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:1.8rem}
.btn{display:inline-block;background:linear-gradient(135deg,var(--r),#b3001b);color:#fff;border:0;padding:.75rem 1.3rem;border-radius:10px;font:700 .8rem Orbitron,sans-serif;letter-spacing:1px;text-transform:uppercase;cursor:pointer;text-decoration:none;box-shadow:0 0 18px rgba(255,45,61,.45);transition:.25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 30px rgba(255,45,61,.8)}.btn:disabled{opacity:.5}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff!important;box-shadow:none}.btn.ghost:hover{border-color:var(--y);box-shadow:0 0 18px rgba(255,210,63,.4)}
.hero .btn:first-child{background:linear-gradient(135deg,var(--y),#ff9f1c);color:#111;box-shadow:0 0 20px rgba(255,210,63,.5)}.btn.sm{padding:.35rem .8rem;font-size:.68rem}.btn.red{background:#7a0014}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.3rem}
.card{position:relative;background:var(--p);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(12px);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.35);overflow:hidden;transition:.3s}
.card::after{content:"";position:absolute;top:0;left:0;width:36px;height:2px;background:var(--y);box-shadow:0 0 8px var(--y)}
.card:hover{transform:translateY(-4px);border-color:rgba(47,107,255,.8);box-shadow:0 0 26px rgba(47,107,255,.3)}
.pad{padding:1.4rem}.bd{padding:1rem}.bd h3{margin:.3rem 0}
.im{aspect-ratio:16/10;background:linear-gradient(135deg,var(--b),var(--r))}.im img{width:100%;height:100%;object-fit:cover}
.tag{background:var(--y);color:#111;padding:0 .5rem;border-radius:6px;font-weight:700}
.stats{display:flex;gap:1rem;flex-wrap:wrap;margin:0 0 2rem}.stats div{flex:1;min-width:130px;background:var(--p);border:1px solid rgba(255,255,255,.1);border-top:2px solid var(--y);padding:1rem;border-radius:12px;text-align:center;color:var(--m)}
.stats b{font:900 2rem Orbitron,sans-serif;color:var(--y);text-shadow:0 0 14px rgba(255,210,63,.6);display:block}
figure{position:relative;cursor:zoom-in;border-radius:14px;overflow:hidden;aspect-ratio:1;border:1px solid rgba(255,255,255,.12);transition:.3s}figure:hover{border-color:var(--y);box-shadow:0 0 24px rgba(255,210,63,.3)}
figure img{width:100%;height:100%;object-fit:cover;transition:.5s}figure:hover img{transform:scale(1.08)}
figcaption{position:absolute;inset:auto 0 0;padding:.7rem;color:#fff;background:linear-gradient(transparent,#000c);font-size:.9rem}
figcaption small{display:block;color:var(--y);font-size:.72rem;text-transform:uppercase;letter-spacing:1px}figcaption b{display:block;line-height:1.25}figcaption span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.8rem;color:#cfd6ff}
.lb{position:fixed;inset:0;background:rgba(3,5,14,.93);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:50;padding:1rem;color:#fff;text-align:center;cursor:zoom-out}.lb.on{display:flex}.lb img{max-height:75vh;border-radius:10px;box-shadow:0 0 40px rgba(47,107,255,.5)}
form{display:grid;gap:.9rem}label{display:grid;gap:.3rem;font-weight:600;color:#cfd6ff}
input,select,textarea{font:inherit;color:#fff;background:rgba(255,255,255,.06);padding:.65rem;border:1px solid rgba(255,255,255,.2);border-radius:10px;width:100%;transition:.2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--b);box-shadow:0 0 0 3px rgba(47,107,255,.35)}option{background:#0b1128;color:#fff}textarea{min-height:90px}
.err{color:#ff6b78;font-weight:600}.ok{color:#4dff9d;font-weight:700}
.fade{animation:f .5s}@keyframes f{from{opacity:0;transform:translateY(10px)}}
ul.l{padding-left:1.2rem}ul.l li::marker{color:var(--y)}
footer{background:rgba(7,11,26,.9);color:var(--m);padding:2rem 5%;text-align:center;border-top:1px solid rgba(255,45,61,.5);box-shadow:0 -6px 30px rgba(255,45,61,.12)}footer b{color:#fff;font-family:Orbitron,sans-serif}footer a{color:var(--y)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}@media(max-width:700px){.two{grid-template-columns:1fr}}
.login{max-width:380px;margin:4rem auto;padding:2rem;text-align:center}.login h2{justify-content:center}
.adm{display:flex;min-height:100vh}.adm aside{width:210px;background:linear-gradient(180deg,#0b1128,#160a20);border-right:1px solid rgba(255,255,255,.1);color:#fff;padding:1rem;display:flex;flex-direction:column;gap:.3rem}.adm aside a{padding:.5rem .7rem;border-radius:8px;cursor:pointer;color:#cfd6ff;transition:.2s}.adm aside a:hover,.adm aside a.on{background:linear-gradient(135deg,var(--r),#b3001b);color:#fff;box-shadow:0 0 14px rgba(255,45,61,.5)}.adm section{flex:1;padding:1.5rem;min-width:0}
@media(max-width:760px){.adm{flex-direction:column}.adm aside{width:auto;flex-direction:row;overflow-x:auto;white-space:nowrap}}
.bar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}.bar>*{width:auto;flex:1;min-width:130px}.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--p);border-radius:12px}td,th{padding:.55rem;border-bottom:1px solid rgba(255,255,255,.08);text-align:left;font-size:.92rem}th{color:var(--y);font-family:Orbitron,sans-serif;font-size:.75rem}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem}.gl .card{padding:.6rem;display:grid;gap:.3rem}.gl img{border-radius:8px}
.toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:#0a6b2d;color:#fff;padding:.7rem 1.2rem;border-radius:10px;opacity:0;pointer-events:none;transition:.3s;z-index:99}.toast.show{opacity:1}.toast.err{background:#b00}
.demo{background:var(--y);color:#111;text-align:center;padding:.4rem;font-size:.85rem;font-weight:600}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

<section class="sec"><div class="stats"><div><b>${A.length}</b>Kegiatan</div><div><b>${Gl.length}</b>Dokumentasi</div></div><h2>Yang Kami Kembangkan</h2><div class="grid"><div class="card pad"><h3>🔬 Penelitian</h3><p>Melatih keterampilan meneliti: dari merumuskan masalah, mengamati, hingga menyusun karya ilmiah.</p></div><div class="card pad"><h3>💡 Inovasi</h3><p>Mendorong ide-ide kreatif siswa yang bermanfaat bagi sekolah dan masyarakat.</p></div><div class="card pad"><h3>🧠 Berpikir Kritis</h3><p>Membiasakan bertanya, menganalisis, dan mengambil kesimpulan berdasarkan bukti.</p></div></div><h2 style="margin-top:2.5rem">Kegiatan Terbaru</h2><div class="grid">${A.slice(0,3).map(card).join("")||none}</div>

async function profil(){await settings();
return `<section class="sec"><h2>Profil KIR SMANCA</h2><div class="card pad"><h3>Sejarah</h3><p>${T(S.history,'<span class="mut">Belum diisi.</span>')}</p></div><div class="two" style="margin-top:1.2rem"><div class="card pad"><h3>Visi</h3><p>${T(S.vision,'<span class="mut">Belum diisi.</span>')}</p></div><div class="card pad"><h3>Misi</h3>${L(S.mission)}</div></div>
<div class="two" style="margin-top:1.2rem"><div class="card pad"><h3>Tujuan</h3>${L(S.goals||DG)}</div><div class="card pad"><h3>Program Kerja</h3>${L(S.programs)}</div></div>
<div class="card pad" style="margin-top:1.2rem"><h3>Struktur Kepengurusan</h3>${L(S.structure)}</div><div class="card pad" style="margin-top:1.2rem"><h3>Peran KIR</h3><p>${T(S.role,DR)}</p></div></section>`}
async function kegiatan(){const A=await acts();
return `<section class="sec"><h2>Kegiatan Terbaru</h2><div class="grid">${A.slice(0,6).map(card).join("")||none}</div>${A.length>6?`<h2 style="margin-top:2.5rem">Arsip Kegiatan</h2><div class="grid">${A.slice(6).map(card).join("")}</div>`:""}</section>`}
async function dokumentasi(){const Gl=await gals();post=zoom;return `<section class="sec"><h2>Dokumentasi</h2><div class="grid">${Gl.map(fig).join("")||none}</div></section>`}
function zoom(){const lb=$("#lb");app.querySelectorAll("figure").forEach(f=>f.onclick=()=>{const g=G.find(x=>x.id==f.dataset.i);lb.innerHTML=`<img src="${g.img}" alt=""><h3 style="color:#fff">${esc(g.title)}</h3><p>${T(g.desc)}</p>`;lb.classList.add("on")});lb.onclick=()=>lb.classList.remove("on")}
async function daftar(){await settings();
if(!S.regOpen)return `<section class="sec narrow"><h2>Pendaftaran Anggota</h2><div class="card pad"><b>Pendaftaran sedang ditutup.</b><p>Pantau Instagram resmi kami untuk informasi pembukaan berikutnya.</p></div></section>`;
post=()=>{const f=$("#f");f.onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(f)),m=$("#m"),b=f.querySelector("button");v.phone=v.phone.replace(/[\s-]/g,"");
for(const k in v)v[k]=v[k].trim();
if(Object.values(v).some(x=>!x)){m.className="err";m.textContent="Semua kolom wajib diisi.";return}
if(!/^\d{8,15}$/.test(v.phone)){m.className="err";m.textContent="Nomor HP harus berupa 8–15 digit angka.";return}
b.disabled=true;b.textContent="Mengirim…";m.textContent="";
try{await settings();if(!S.regOpen){location.reload();return}
await F.addDoc(F.collection(db,"members"),{name:v.name,kelas:v.kelas,phone:v.phone,reason:v.reason,createdAt:F.serverTimestamp()});
f.reset();m.className="ok";m.textContent="Pendaftaran berhasil"}catch(x){console.error(x);m.className="err";m.textContent="Gagal mengirim. Periksa koneksi internet dan coba lagi."}
b.disabled=false;b.textContent="Kirim Pendaftaran"}};
return `<section class="sec narrow"><h2>Pendaftaran Anggota</h2><form id="f" class="card pad"><label>Nama lengkap<input name="name" required maxlength="100"></label><label>Kelas<select name="kelas" required><option value="">Pilih kelas</option>${F.KELAS.map(k=>`<option>${k}</option>`).join("")}</select></label><label>Nomor HP / WhatsApp<input name="phone" type="tel" inputmode="numeric" required placeholder="08xxxxxxxxxx"></label><label>Alasan bergabung<textarea name="reason" required maxlength="1000"></textarea></label><p id="m" role="status"></p><button class="btn">Kirim Pendaftaran</button></form></section>`}
async function kontak(){await settings();post=()=>{const f=$("#sf");f.onsubmit=async e=>{e.preventDefault();const m=$("#sm"),b=f.querySelector("button"),v=Object.fromEntries(new FormData(f));if(v.message.trim().length<5){m.className="err";m.textContent="Pesan terlalu pendek.";return}b.disabled=true;b.textContent="Mengirim…";try{await F.addDoc(F.collection(db,"feedback"),{name:v.name.trim(),message:v.message.trim(),createdAt:F.serverTimestamp()});f.reset();m.className="ok";m.textContent="Terima kasih atas masukan Anda."}catch(x){console.error(x);m.className="err";m.textContent="Gagal mengirim. Coba lagi."}b.disabled=false;b.textContent="Kirim"}};
return `<section class="sec"><h2>Kontak & Media Sosial</h2><div class="two"><div class="card pad"><h3>Hubungi Kami</h3><p>Instagram: <b>@kir.sman1campalagian</b></p>${S.email?`<p>Email: ${esc(S.email)}</p>`:""}${S.phone?`<p>Telepon/WA: ${esc(S.phone)}</p>`:""}<p>UPTD SMA Negeri 1 Campalagian</p><br><a class="btn" target="_blank" rel="noopener" href="${IG}">Kunjungi Instagram</a></div><form id="sf" class="card pad"><h3>Kritik & Saran</h3><label>Nama (opsional)<input name="name" maxlength="100"></label><label>Pesan<textarea name="message" required maxlength="1000"></textarea></label><p id="sm" role="status"></p><button class="btn">Kirim</button></form></div></section>`}
let fired=0;const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){fired=1;e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.1});
function reveal(){setTimeout(()=>{if(!fired)document.querySelectorAll(".rv").forEach(e=>e.classList.add("in"))},1500);document.querySelectorAll(".card,figure,.stats div,h2").forEach(e=>{e.classList.add("rv");io.observe(e)})}
const routes={beranda,profil,kegiatan,dokumentasi,daftar,kontak};
async function route(){const r=location.hash.slice(1)in routes?location.hash.slice(1):"beranda";document.querySelectorAll("#mn a").forEach(a=>a.classList.toggle("on",a.hash=="#"+r));$("#mn").classList.remove("open");post=null;app.innerHTML='<div class="sec mut">Memuat…</div>';scrollTo(0,0);
try{if(r!="profil"&&r!="daftar"&&r!="kontak")await settings();app.innerHTML=await routes[r]();post&&post()}catch(e){console.error(e);app.innerHTML='<div class="sec err">'+(F.configured?"Gagal memuat data. Periksa koneksi internet, dan pastikan aturan Firestore sudah dipublikasikan.":"Konfigurasi Firebase belum diisi di config.js.")+"</div>"}app.className="fade";reveal()}
$("#bg").onclick=()=>$("#mn").classList.toggle("open");addEventListener("hashchange",route);route();
</script></body></html>
