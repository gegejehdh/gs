function route(){const h=location.hash.slice(1);E={};show(IDS.includes(h)?h:"dashboard")}
async function dash(){const N=[["activities","Kegiatan",0],["gallery","Dokumentasi",0],["members","Pendaftar",0],["team","Anggota Publik",0],["feedback","Saran",0]],TO=p=>Promise.race([p,new Promise((_,j)=>setTimeout(()=>j({code:"timeout"}),10000))]);
const R=await Promise.all(N.map(async([k,n,pb])=>{try{const q=await TO(Fs.getDocs(Fs.collection(db,k)));return{k,n,c:q.size,pub:k=="gallery"?q.size:pb?q.docs.filter(d=>d.data().published===true).length:null}}catch(e){return{k,n,e:e.code||e.message||"error"}}}));
let open=false,rec=[],se="",ss={};
try{const d=await TO(Fs.getDoc(Fs.doc(db,"settings","site")));ss=d.exists()?d.data():{};open=!!ss.regOpen}catch(e){se=e.code||e.message||"error"}
try{rec=(await TO(Fs.getDocs(Fs.query(Fs.collection(db,"members"),Fs.orderBy("createdAt","desc"))))).docs.slice(0,5).map(d=>d.data())}catch(e){}
const bad=R.filter(x=>x.e).map(x=>[x.n,x.e]).concat(se?[["Pengaturan",se]]:[]),pid=(db.app&&db.app.options&&db.app.options.projectId)||"demo";
V.innerHTML=`<h2>Ringkasan</h2>
<div class="card pad" style="margin-bottom:1.2rem;border-color:${bad.length?"#ff2d3d":"#2bd46a"}"><h3>Status Koneksi Database</h3>${bad.length?`<p class="err"><b>✗ Ada masalah koneksi</b> (project: ${esc(pid)})</p><ul>${bad.map(([n,e])=>`<li>${esc(n)}: ${esc(hint(e))}</li>`).join("")}</ul>`:`<p class="ok">✓ Terhubung ke Firebase · project: <b>${esc(pid)}</b></p>`}</div>
<div class="dgrid">${R.map(x=>`<a href="#${x.k}"><b>${x.e?"–":x.c}</b>${x.n}${x.pub!=null&&!x.e?`<small style="display:block;color:var(--y)">${x.pub} tampil di situs</small>`:""}</a>`).join("")}</div>
<p class="mut" style="margin:-.6rem 0 1.2rem">Jumlah "tampil di situs" selalu sama dengan yang dilihat pengunjung, karena situs publik dan admin membaca database yang sama.</p>
<div class="card pad" style="margin-bottom:1.2rem"><h3>Status Pendaftaran</h3><p>Pendaftaran anggota saat ini <span class="pill ${open?"on":"off"}">${open?"DIBUKA":"DITUTUP"}</span> &nbsp;<a href="#settings" class="btn sm ghost">Ubah</a></p></div>
<div class="card pad" style="margin-bottom:1.2rem"><h3>Impor Data Awal</h3><p class="mut">Foto dan kegiatan bawaan situs lama (1 kegiatan, 3 foto dokumentasi, logo, dan foto latar beranda) belum otomatis ada di database. Klik tombol ini agar tampil juga di admin dengan jumlah yang sama seperti di situs publik. Aman diklik berulang (tidak menggandakan data).</p><button class="btn" id="imp">Impor Data Awal</button></div>
<div class="card pad"><h3>Pendaftar Terbaru</h3>${rec.length?`<div class="tw"><table><tr><th>Nama</th><th>Kelas</th><th>HP</th><th>Alamat</th></tr>${rec.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.kelas)}</td><td>${esc(x.phone)}</td><td>${esc(x.address)}</td></tr>`).join("")}</table></div><p style="margin-top:.8rem"><a class="btn sm" href="#members">Lihat semua</a></p>`:'<p class="mut">Belum ada pendaftar.</p>'}</div>
<div class="bar" style="margin-top:1.2rem"><a class="btn sm" href="#activities">+ Tambah Kegiatan</a><a class="btn sm" href="#gallery">+ Tambah Dokumentasi</a><a class="btn sm" href="#team">+ Tambah Anggota</a></div>
<div class="card pad" style="margin-top:1.2rem;border-color:#ff2d3d"><h3 style="color:#ff6b75">Zona Berbahaya</h3><p class="mut">Hapus data dari database untuk mulai dari nol. Website publik ikut berubah dan data tidak bisa dikembalikan.</p><button class="btn red" id="rs">Reset Data…</button></div>`;
$("#rs").onclick=resetUI;
$("#imp").onclick=async ev=>{if(!confirm("Salin data awal (1 kegiatan, 3 foto, logo, foto latar) ke database?"))return;const b=ev.target;b.disabled=true;
try{const sd=await import("./seed-data.js"),now=Date.now();let i=0;
for(const [id,d] of Object.entries(sd.activities))await Fs.setDoc(Fs.doc(db,"activities",id),{...d,createdAt:new Date(now-(i++)*1000)});
for(const [id,d] of Object.entries(sd.gallery))await Fs.setDoc(Fs.doc(db,"gallery",id),{...d,createdAt:new Date(now-(i++)*1000)});
const add={};if(!ss.logo)add.logo=sd.logo;if(!ss.heroImg)add.heroImg=sd.heroImg;if(Object.keys(add).length)await Fs.setDoc(Fs.doc(db,"settings","site"),add,{merge:true});
toast("Data awal berhasil diimpor");show("dashboard")}catch(x){console.error(x);toast("Gagal mengimpor: "+(x.code||x.message),1);b.disabled=false}}}
function resetUI(){const G=[["activities","Kegiatan"],["gallery","Dokumentasi"],["team","Daftar Anggota"],["members","Pendaftar"],["feedback","Saran"],["settings","Pengaturan situs (visi, misi, struktur, logo, foto latar, status pendaftaran)"]];
const o=mo(`<h3 style="color:#ff6b75">Reset Data</h3><p>Pilih data yang akan dihapus <b>permanen</b> dari database. Website publik ikut berubah.</p><form id="rf">${G.map(([k,n])=>`<label style="display:flex;gap:.5rem;align-items:flex-start"><input type="checkbox" name="${k}" checked style="width:auto;margin-top:.25rem">${n}</label>`).join("")}<label>Ketik <b>RESET</b> untuk konfirmasi<input name="c" autocomplete="off"></label><p id="rm" class="err"></p><div class="bar"><button class="btn red">Hapus Data Terpilih</button><button type="button" class="btn ghost" id="rx">Batal</button></div></form>`);
o.querySelector("#rx").onclick=()=>o.remove();
o.querySelector("#rf").onsubmit=async ev=>{ev.preventDefault();const f=ev.target,ks=G.map(x=>x[0]).filter(k=>f.elements[k].checked),m=o.querySelector("#rm");
if(f.elements.c.value.trim()!=="RESET"){m.textContent='Ketik persis: RESET';return}if(!ks.length){m.textContent="Pilih minimal satu data.";return}
const b=f.querySelector("button");b.disabled=true;m.textContent="Menghapus…";
try{let n=0;for(const k of ks){const q=await Fs.getDocs(Fs.collection(db,k));for(const d of q.docs){await Fs.deleteDoc(Fs.doc(db,k,d.id));n++}}
o.remove();toast("Selesai: "+n+" data dihapus");show("dashboard")}catch(x){console.error(x);m.textContent="Gagal: "+(x.code||x.message);b.disabled=false}}}
const hint=c=>c=="permission-denied"?"Akses ditolak: aturan Firestore (firestore.rules) belum dipasang/di-Publish, atau Anda belum login sebagai admin. (permission-denied)":(c=="timeout"||c=="unavailable")?"Tidak ada jawaban dari database: pastikan Firestore Database sudah dibuat di Firebase Console dan koneksi internet aktif. ("+c+")":"Terjadi kesalahan ("+c+").";
async function show(t){document.querySelectorAll("aside a[data-t]").forEach(a=>a.classList.toggle("on",a.dataset.t==t));V.innerHTML='<p class="mut">Memuat…</p>';
try{await Promise.race([(async()=>{if(t=="dashboard")await dash();else if(t=="members")await list("members",[["name","Nama"],["kelas","Kelas"],["phone","HP"],["address","Alamat"],["reason","Alasan"],["createdAt","Tanggal"]],"Pendaftar");else if(t=="feedback")await list("feedback",[["name","Nama"],["message","Pesan"],["createdAt","Tanggal"]],"Kritik & Saran");else if(t=="settings")await form(t,(await Fs.getDoc(Fs.doc(db,"settings","site"))).data()||{});else await crud(t)})(),new Promise((_,j)=>setTimeout(()=>j({code:"timeout"}),15000))])}
catch(x){console.error(x);V.innerHTML=`<p class="err">Gagal memuat. ${esc(hint(x.code||x.message))}</p>`}}
async function collect(f,T,e){const d={};for(const [k,,t] of T.f){const el=f.elements[k];if(t=="chk")d[k]=el.checked;else if(t=="img"){const fl=el.files[0];d[k]=fl?await pack(fl):(e[k]||"")}else d[k]=el.value.trim()}return d}
const DEFS={
history:"KIR SMANCA adalah Kelompok Ilmiah Remaja di bawah naungan UPTD SMA Negeri 1 Campalagian, Kabupaten Polewali Mandar, Sulawesi Barat. KIR hadir sebagai wadah bagi siswa yang memiliki rasa ingin tahu, minat pada sains, dan semangat untuk berkarya. Melalui pelatihan, praktik laboratorium, dan pengamatan langsung di lapangan, anggota dibimbing untuk berpikir kritis, bekerja sama, serta menuangkan gagasan menjadi karya ilmiah yang bermanfaat bagi sekolah dan masyarakat.",
vision:"Menjadi wadah pembinaan remaja yang berpikir kritis, kreatif, inovatif, dan berkarakter ilmiah, serta mampu menghasilkan karya yang bermanfaat bagi sekolah, masyarakat, dan lingkungan.",
mission:"Menumbuhkan minat dan budaya meneliti di kalangan siswa.\nMeningkatkan kemampuan berpikir kritis, logis, dan sistematis.\nMembimbing anggota menyusun karya tulis ilmiah dan proyek inovasi.\nMendorong partisipasi siswa dalam lomba dan kegiatan ilmiah.\nMembangun kerja sama, kejujuran, dan tanggung jawab dalam setiap kegiatan.\nMemanfaatkan sains dan teknologi untuk menjawab persoalan di lingkungan sekitar.",
goals:"Melahirkan siswa yang gemar meneliti dan berkarya ilmiah.\nMengembangkan keterampilan observasi, eksperimen, dan penulisan ilmiah.\nMenyiapkan anggota yang percaya diri tampil di ajang lomba karya ilmiah.\nMengharumkan nama sekolah melalui prestasi akademik dan non-akademik.",
programs:"Pelatihan dasar Kelompok Ilmiah Remaja.\nPraktik di laboratorium dan pengamatan lapangan.\nBimbingan penulisan karya tulis ilmiah.\nPersiapan dan pendampingan mengikuti lomba.\nDiskusi dan seminar sains berkala.\nDokumentasi dan publikasi kegiatan melalui media sosial.",
role:"KIR berperan sebagai ruang belajar di luar kelas tempat siswa mengasah kemampuan meneliti, berinovasi, dan berkomunikasi ilmiah, sekaligus menjadi jembatan antara ilmu yang dipelajari di sekolah dengan penerapannya di kehidupan nyata.",structure:"Pembina: Fatni, S.Pd.\nKetua: Geril Suardi\nWakil: Ilham\nSekretaris: Juliana\nBendahara: Chaisyah"};
const tm=x=>x.createdAt&&x.createdAt.toMillis?x.createdAt.toMillis():0;
const mo=h=>{const o=document.createElement("div");o.className="mo";o.innerHTML=`<div class="card pad">${h}</div>`;document.body.appendChild(o);o.onmousedown=ev=>{if(ev.target===o)o.remove()};return o};
const orow=r=>`<div class="orow"><input placeholder="Jabatan" value="${esc(r[0])}"><input placeholder="Nama" value="${esc(r[1])}"><button type="button" class="btn sm ghost" data-m="-1" title="Naik">↑</button><button type="button" class="btn sm ghost" data-m="1" title="Turun">↓</button><button type="button" class="btn sm red" data-m="x" title="Hapus">✕</button></div>`;
const org=v=>{const R=String(v||"").split("\n").map(x=>x.trim()).filter(Boolean).map(x=>{const i=x.indexOf(":");return i<0?["",x]:[x.slice(0,i).trim(),x.slice(i+1).trim()]});
return `<div id="og"><b>Struktur kepengurusan</b><small style="display:block;margin-bottom:.6rem">Tiga baris pertama tampil bertingkat di atas, sisanya sebagai cabang. Gunakan ↑ ↓ untuk mengurutkan.</small><input type="hidden" name="structure"><div id="orows">${R.map(orow).join("")}</div><button type="button" class="btn sm ghost" id="oadd">+ Tambah Pengurus</button></div>`};
function orgInit(f){const box=f.querySelector("#orows"),hid=f.elements["structure"];
const sync=()=>{hid.value=[...box.children].map(d=>{const [a,b]=d.querySelectorAll("input"),r=a.value.trim(),n=b.value.trim();return r||n?(r?r+": ":"")+n:""}).filter(Boolean).join("\n")};
box.oninput=sync;
box.onclick=ev=>{const b=ev.target.closest("[data-m]");if(!b)return;const row=b.closest(".orow"),m=b.dataset.m;if(m=="x")row.remove();else if(m=="-1"&&row.previousElementSibling)box.insertBefore(row,row.previousElementSibling);else if(m=="1"&&row.nextElementSibling)box.insertBefore(row.nextElementSibling,row);sync()};
f.querySelector("#oadd").onclick=()=>{box.insertAdjacentHTML("beforeend",orow(["",""]));box.lastElementChild.querySelector("input").focus();sync()};sync()}
async function form(c,e){const T=TABS[c],F=Object.fromEntries(T.f.map(x=>[x[0],x]));for(const k in DEFS)if(!e[k])e[k]=DEFS[k];
const G=[["Beranda",["heroTitle","tagline","heroImg","logo"]],["Profil & Visi Misi",["history","vision","mission","goals","programs","role"]],["Pengurus",["structure"]],["Kontak",["email","phone"]],["Pendaftaran",["regOpen"]]],
fld=k=>k=="structure"?org(e.structure):inp(k,F[k][1],F[k][2],e[k]);
V.innerHTML=`<div class="hd"><h2>${T.n}</h2></div><div class="tabs">${G.map((g,i)=>`<button type="button" class="tb${i?"":" on"}" data-g="${i}">${g[0]}</button>`).join("")}</div><form id="cf" class="card pad">${G.map((g,i)=>`<div class="gp" data-g="${i}"${i?' style="display:none"':""}>${i==0?'<p class="mut">Logo dan foto latar yang diunggah di sini langsung tampil di situs publik. Kosongkan untuk memakai gambar bawaan situs.</p>':""}${g[1].map(fld).join("")}</div>`).join("")}<button class="btn">Simpan Semua Perubahan</button></form>`;
const f=$("#cf");orgInit(f);
V.querySelectorAll(".tb").forEach(b=>b.onclick=()=>{V.querySelectorAll(".tb").forEach(x=>x.classList.toggle("on",x==b));V.querySelectorAll(".gp").forEach(g=>g.style.display=g.dataset.g==b.dataset.g?"grid":"none")});
f.onsubmit=async ev=>{ev.preventDefault();const b=f.lastElementChild;b.disabled=true;try{await Fs.setDoc(Fs.doc(db,"settings","site"),await collect(f,T,e),{merge:true});toast("Tersimpan");show("settings")}catch(x){console.error(x);toast(typeof x=="string"?x:"Gagal menyimpan",1);b.disabled=false}}}
async function crud(c){const T=TABS[c],HP=T.f.some(f=>f[0]=="published"),s=await Fs.getDocs(Fs.collection(db,c)),L=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>tm(b)-tm(a));
V.innerHTML=`<div class="hd"><h2>${T.n} (${L.length})${HP?` · ${L.filter(x=>x.published===true).length} tampil di situs`:" · semua tampil di situs"}</h2><button class="btn" id="add">+ Tambah</button></div><input id="q" placeholder="🔍 Cari…" style="margin-bottom:1rem"><div class="gl" id="gl"></div>`;
const edit=e=>{const o=mo(`<h3>${e.id?"Ubah":"Tambah"} · ${T.n}</h3><form id="mf">${T.f.map(([k,l,t])=>inp(k,l,t,e[k])).join("")}<div class="bar"><button class="btn">Simpan</button><button type="button" class="btn ghost" id="cx">Batal</button></div></form>`);
o.querySelector("#cx").onclick=()=>o.remove();
o.querySelector("#mf").onsubmit=async ev=>{ev.preventDefault();const b=ev.target.querySelector("button");b.disabled=true;try{const d=await collect(ev.target,T,e);if(!d.title)throw"Nama / judul wajib diisi";if(c=="gallery"&&!d.img)throw"Foto wajib diisi";
if(e.id)await Fs.updateDoc(Fs.doc(db,c,e.id),d);else await Fs.addDoc(Fs.collection(db,c),{...d,createdAt:Fs.serverTimestamp()});o.remove();toast("Tersimpan");crud(c)}catch(x){console.error(x);toast(typeof x=="string"?x:"Gagal menyimpan",1);b.disabled=false}}};
const draw=()=>{const q=$("#q").value.toLowerCase(),R=L.filter(x=>((x.title||"")+" "+(x.category||"")).toLowerCase().includes(q));
$("#gl").innerHTML=R.map(x=>`<div class="card">${x.img?`<img src="${x.img}" alt="">`:""}<b>${esc(x.title)}</b><small>${esc(x.category||"")}${x.date?" · "+esc(x.date):""}${HP?(x.published===true?" · ✓ tampil di situs":" · draf (tidak tampil)"):""}</small><div class="bar"><button class="btn sm" data-e="${x.id}">✏️ Ubah</button><button class="btn sm red" data-d="${x.id}">🗑 Hapus</button></div></div>`).join("")||'<p class="mut">Belum ada data. Klik "+ Tambah".</p>';
V.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>edit(L.find(x=>x.id==b.dataset.e)));
V.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{if(confirm("Hapus data ini?")){try{await Fs.deleteDoc(Fs.doc(db,c,b.dataset.d));toast("Dihapus");crud(c)}catch(x){toast("Gagal menghapus",1)}}})};
$("#add").onclick=()=>edit({published:true});$("#q").oninput=draw;draw()}
async function list(c,cols,h){const s=await Fs.getDocs(Fs.query(Fs.collection(db,c),Fs.orderBy("createdAt","desc"))),L=s.docs.map(d=>({id:d.id,...d.data()})),val=(x,k)=>k=="createdAt"?(x[k]&&x[k].toDate?x[k].toDate().toLocaleString("id-ID"):""):x[k];
V.innerHTML=`<h2>${h} (${L.length})</h2>${c=="members"?'<button class="btn sm" id="csv">Unduh CSV</button>':""}<div class="tw" style="margin-top:1rem"><table><tr>${cols.map(x=>`<th>${x[1]}</th>`).join("")}<th></th></tr>${L.map(x=>`<tr>${cols.map(([k])=>`<td>${esc(val(x,k))}</td>`).join("")}<td>${c=="members"?`<button class="btn sm" data-a="${x.id}">Jadikan Anggota</button> `:""}<button class="btn sm red" data-d="${x.id}">Hapus</button></td></tr>`).join("")}</table></div>`;
V.querySelectorAll("[data-a]").forEach(b=>b.onclick=async()=>{const x=L.find(y=>y.id==b.dataset.a);if(!x||!confirm("Tampilkan "+x.name+" di daftar anggota situs?"))return;b.disabled=true;try{await Fs.addDoc(Fs.collection(db,"team"),{title:x.name||"",category:x.kelas||"",desc:"",img:"",published:true,createdAt:Fs.serverTimestamp()});toast("Ditambahkan ke Daftar Anggota");b.textContent="✓ Sudah"}catch(e){console.error(e);toast("Gagal menambahkan",1);b.disabled=false}});
V.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{if(confirm("Hapus data ini?")){await Fs.deleteDoc(Fs.doc(db,c,b.dataset.d));toast("Dihapus");list(c,cols,h)}});
if($("#csv"))$("#csv").onclick=()=>{const q=v=>{v=String(v??"");if(/^[=+\-@]/.test(v))v="'"+v;return'"'+v.replace(/"/g,'""')+'"'},t=[cols.map(x=>q(x[1])).join(",")].concat(L.map(x=>cols.map(([k])=>q(val(x,k))).join(","))).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+t],{type:"text/csv"}));a.download="anggota-kir.csv";a.click()}}
init();
</script></body></html>
